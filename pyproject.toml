[project]
name = "dslr"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dslr"]
