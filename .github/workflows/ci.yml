name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - run: uv run pytest -v
      - name: Train and predict end to end
        run: |
          uv run python logreg/logreg_train.py datasets/dataset_train.csv
          uv run python logreg/logreg_predict.py datasets/dataset_test.csv weights.json
          head -3 houses.csv

  actions-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify actions.lock matches workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock
          gh actions-lock --verify
